<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── Primary SEO ── -->
    <title>
      BELOV — Plus Size Fashion Marketplace | Inclusive Styles for Every Body
    </title>

    <meta
      name="description"
      content="Shop plus size fashion at BELOV — a premium marketplace for inclusive styles, better fits, and confidence-first clothing. Discover dresses, tops, and outfits designed for real bodies."
    />

    <meta
      name="keywords"
      content="plus size fashion, plus size clothing, curvy fashion, inclusive fashion, plus size dresses, plus size outfits, body positive fashion, women's plus size clothing, fashion marketplace India"
    />

    <meta name="author" content="BELOV" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://belov.in/" />

    <!-- ── Open Graph (Facebook / LinkedIn) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BELOV" />
    <meta
      property="og:title"
      content="BELOV — Plus Size Fashion That Feels Like You"
    />
    <meta
      property="og:description"
      content="Discover inclusive fashion for real bodies. Shop curated plus-size styles, better fits, and confidence-first outfits at BELOV."
    />
    <meta property="og:image" content="https://belov.in/full-logo.png" />
    <meta property="og:url" content="https://belov.in/" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="BELOV — Plus Size Fashion Marketplace"
    />
    <meta
      name="twitter:description"
      content="Explore plus-size fashion designed for real bodies. Better fits, curated styles, and confident looks — only at BELOV."
    />
    <meta name="twitter:image" content="https://belov.in/full-logo.png" />

    <!-- ── Theme & PWA ── -->
    <meta name="theme-color" content="#191715" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- ── Preconnect (Performance) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Structured Data (SEO Boost) ── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "BELOV",
        "url": "https://belov.in/",
        "logo": "https://belov.in/full-logo.png",
        "description": "BELOV is a premium plus-size fashion marketplace offering inclusive styles, better fits, and curated collections designed for real bodies.",
        "sameAs": [],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://belov.in/collections?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
